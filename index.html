<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1017">
<title>OnKlooth Takeoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════ TOKENS ═══════════════════════ */
:root, :root[data-theme="dark"]{
  --bg:#0a1017; --surface:#111b28; --line:#22334a; --ink:#e8eef6; --mut:#8fa3ba;
  --accent:#2f80ed; --accent-hover:#4d94f0; --accent-active:#6aa5f3; --accent-tint:#132741;
  --ok:#4fc341; --ok-tint:#0f2a14; --ok-ink:#84e276;
  --bad:#f87171; --bad-tint:#331419; --bad-ink:#f89b9b;
  --warn:#fbbf24; --warn-tint:#2f2510; --warn-ink:#fbd35e;
  --on-solid:#0a1017;
  --bg2:#060b11; --line2:#2e4463; --dim:#61748c;
  --shadow-md:0 3px 10px rgba(0,0,0,.16); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  --bg:#f2f4f6; --surface:#ffffff; --line:#d3dce6; --ink:#16212d; --mut:#5c6c80;
  --accent:#1e66c8; --accent-hover:#1857ab; --accent-active:#14407e; --accent-tint:#e7f0fb;
  --ok:#2e8f24; --ok-tint:#e4f3e0; --ok-ink:#1f6b18;
  --bad:#c43d3d; --bad-tint:#fae7e7; --bad-ink:#a02c2c;
  --warn:#996a00; --warn-tint:#fbf2d6; --warn-ink:#7a5500;
  --on-solid:#ffffff;
  --bg2:#e6eaef; --line2:#b9c6d4; --dim:#8394a6;
  --shadow-lg:0 12px 32px rgba(20,30,45,.22);
}
:root{
  --hd:'Barlow Condensed',system-ui,sans-serif;
  --bd:'Barlow',system-ui,sans-serif;
  --mo:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--bd);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{min-height:100%}
button{cursor:pointer;font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--hd);font-weight:600;line-height:1.1;letter-spacing:-.01em;margin:0}
.mono{font-family:var(--mo)}

/* ═══════════════════════ BLUEPRINT FRAME ═══════════════════════ */
.frame{position:relative;border:1px solid var(--line);border-radius:0;background:var(--surface)}
.cn{position:absolute;width:11px;height:11px;color:color-mix(in srgb,var(--ink) 55%,transparent);pointer-events:none}
.cn::before,.cn::after{content:"";position:absolute;background:currentColor}
.cn::before{left:5px;top:0;width:1px;height:100%}
.cn::after{top:5px;left:0;width:100%;height:1px}
.cn.tl{top:-6px;left:-6px}.cn.tr{top:-6px;right:-6px}.cn.bl{bottom:-6px;left:-6px}.cn.br{bottom:-6px;right:-6px}
.grid-bg{background-image:
  linear-gradient(var(--line) 1px,transparent 1px),
  linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-position:center;opacity:1}

/* ═══════════════════════ WORDMARK ═══════════════════════ */
.mark{position:relative;display:inline-grid;place-items:center;border:1.5px solid var(--accent);color:var(--accent);
  font-family:var(--hd);font-weight:600;line-height:1;flex:none}
.mark::after{content:"";position:absolute;right:-2px;bottom:-2px;width:6px;height:6px;background:var(--ok)}
.mark.s34{width:34px;height:34px;font-size:15px}
.mark.s48{width:48px;height:48px;font-size:20px}
.mark.s56{width:56px;height:56px;font-size:24px}
.lockup{display:flex;flex-direction:column;gap:1px;line-height:1}
.lockup .lk1{font-family:var(--hd);font-weight:600;font-size:16px;letter-spacing:.02em}
.lockup .lk2{font-family:var(--mo);font-size:9px;letter-spacing:.28em;color:var(--mut)}

/* ═══════════════════════ BUTTONS ═══════════════════════ */
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--hd);font-weight:600;
  font-size:14px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);background:transparent;
  color:var(--ink);border-radius:0;padding:0 16px;min-height:44px;transition:background .12s,border-color .12s}
.b svg{display:block}
.b.pri{background:var(--accent);border-color:var(--accent);color:var(--on-solid)}
.b.pri:hover{background:var(--accent-hover)}
.b.pri:active{background:var(--accent-active)}
.b.ok{background:var(--ok);border-color:var(--ok);color:var(--on-solid)}
.b.ok:hover{filter:brightness(1.06)}
.b.sec:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.b.ghost{border-color:transparent;color:var(--accent);min-height:44px}
.b.ghost:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.b.big{min-height:56px;font-size:16px}
.b.mid{min-height:52px}
.b.block{width:100%}
.b:disabled{opacity:.45;cursor:not-allowed}
.b.icon{width:44px;min-height:44px;padding:0}

/* ═══════════════════════ INPUT + UNIT ═══════════════════════ */
.f{display:flex;align-items:stretch;min-height:54px;border:1px solid var(--line);background:var(--surface);transition:border-color .12s,box-shadow .12s}
.f:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.f-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:6px 11px}
.f-lbl{font-family:var(--mo);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);transition:color .12s}
.f:focus-within .f-lbl{color:var(--accent)}
.f-val{width:100%;background:none;border:none;color:var(--ink);font-family:var(--mo);font-size:17px;padding:2px 0;caret-color:var(--accent)}
.f-val:focus{outline:none}
.f-unit{display:flex;align-items:center;padding:0 12px;border-left:1px solid var(--line);font-family:var(--mo);font-size:11px;color:var(--mut);flex:none}
.f-wrap{display:flex;flex-direction:column;min-width:0}
.f-info{margin-top:5px;font-family:var(--mo);font-size:10px;line-height:1.5;letter-spacing:.01em;color:var(--mut);border-left:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);padding:5px 9px}
.cat-info{font-family:var(--mo);font-size:10px;letter-spacing:.02em;color:var(--mut);padding:6px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent) 4%,transparent)}
.b.icon.on{background:var(--accent);border-color:var(--accent);color:var(--on-solid)}
.f-sel{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);min-height:54px;padding:0 12px;font-family:var(--bd);font-size:14px;border-radius:0}
.field-lbl{display:block;font-family:var(--mo);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}

/* ═══════════════════════ SEGMENTED ═══════════════════════ */
.seg{display:flex;border:1px solid var(--line);width:100%}
.seg button{flex:1;min-height:48px;border:none;border-left:1px solid var(--line);background:transparent;color:var(--mut);
  font-family:var(--hd);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.03em;padding:0 6px}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--accent);color:var(--on-solid)}
.seg button:not(.on):hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.seg.mono button{font-family:var(--mo);font-weight:500;font-size:13px;text-transform:none;letter-spacing:0}
.seg.seg-inline{width:auto;flex:none}
.seg.seg-inline button{flex:none;min-height:38px;padding:0 14px}

/* ═══════════════════════ LAYOUT ═══════════════════════ */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 18px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .sp{flex:1}
.body{flex:1;display:flex}
.nav{width:216px;flex:0 0 216px;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto}
.nav .grp{font-family:var(--mo);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:16px 8px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:48px;color:var(--mut);font-family:var(--hd);font-weight:600;
  font-size:15px;text-transform:uppercase;letter-spacing:.02em;border:1px solid transparent;margin-bottom:2px}
.nav a.act{background:var(--accent-tint);border-color:var(--line);color:var(--ink)}
.nav a.act svg{color:var(--accent)}
.nav a:not(.act):hover{color:var(--ink)}
.nav a svg{color:var(--mut);flex:none}
.nav a .bdg{margin-left:auto;font-family:var(--mo);font-size:10px;color:var(--mut);border:1px solid var(--line);padding:1px 7px}
.main{flex:1;min-width:0;padding:24px 28px 96px;max-width:1180px}
.main.wide{max-width:none}
.menu-btn{display:none}
@media(max-width:880px){
  .nav{position:fixed;left:0;top:57px;z-index:35;background:var(--bg);transform:translateX(-100%);transition:transform .18s}
  .nav.open{transform:none}
  .main{padding:18px 15px 96px}
  .menu-btn{display:inline-flex}
}
.head{margin-bottom:22px}
.head h1{font-family:var(--hd);font-weight:600;font-size:26px;text-transform:uppercase;letter-spacing:.01em}
.head .meta{font-family:var(--mo);font-size:11px;letter-spacing:.06em;color:var(--mut);margin-top:5px;text-transform:uppercase}
.kick{font-family:var(--mo);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.kick.acc{color:var(--accent)}

/* ═══════════════════════ CARDS / GRID ═══════════════════════ */
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:820px){.split,.g2,.g3{grid-template-columns:1fr}}
.card{padding:18px}
.card + .card{margin-top:14px}
.card h3{font-family:var(--hd);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.card .ch{font-family:var(--mo);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:3px 0 15px}
.stat{padding:13px 15px}
.stat .sk{font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.stat .sv{font-family:var(--mo);font-weight:500;font-size:28px;color:var(--ink);margin-top:5px}
.stat .ss{font-family:var(--mo);font-size:12px;color:var(--ok-ink);margin-top:2px}

/* ═══════════════════════ RESULT CARD ═══════════════════════ */
.result{padding:20px;box-shadow:var(--shadow-md)}
.r-kick{font-family:var(--mo);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.r-hero{display:flex;align-items:baseline;gap:9px;margin:8px 0 4px}
.r-n{font-family:var(--mo);font-weight:700;font-size:58px;line-height:.95;color:var(--accent);letter-spacing:-.02em}
.r-n.ok{color:var(--ok-ink)} .r-n.bad{color:var(--bad)}
.r-u{font-family:var(--mo);font-size:16px;color:var(--mut)}
.r-rows{margin-top:12px;border-top:1px solid var(--line)}
.rr{display:flex;justify-content:space-between;align-items:center;min-height:34px;border-bottom:1px solid var(--line);gap:10px}
.rr .k{font-size:12.5px;color:var(--mut)}
.rr .v{font-family:var(--mo);font-size:13px;color:var(--ink);text-align:right}
.rr .v small{color:var(--mut);font-size:11px}
.r-act{display:flex;gap:10px;margin-top:16px}
.r-act .b{flex:1;min-height:52px}
.r-act .b.ok{flex:1.3}

/* ═══════════════════════ VERDICT ═══════════════════════ */
.vp{display:inline-flex;align-items:center;font-family:var(--mo);font-size:10.5px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;padding:4px 10px;border:1px solid}
.vp.good{background:var(--ok-tint);border-color:var(--ok);color:var(--ok-ink)}
.vp.bad{background:var(--bad-tint);border-color:var(--bad);color:var(--bad-ink)}
.vp.check{background:var(--warn-tint);border-color:var(--warn);color:var(--warn-ink)}
.vp.clear{background:transparent;border-color:var(--line);color:var(--mut)}
.vt{width:100%;border-collapse:collapse;font-family:var(--mo)}
.vt th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:500}
.vt th:first-child{text-align:left}
.vt td{font-size:12.5px;padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;color:var(--ink)}
.vt td:first-child{text-align:left;color:var(--mut)}
.vt tr:last-child td{border-bottom:none}
.callout{display:flex;gap:11px;align-items:flex-start;margin-top:14px;padding:12px 14px;border:1px solid;border-radius:0}
.callout.ok{border-color:var(--ok);background:var(--ok-tint)}
.callout.bad{border-color:var(--bad);background:var(--bad-tint)}
.callout .ct{font-family:var(--hd);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.01em}
.callout.ok .ct{color:var(--ok-ink)} .callout.bad .ct{color:var(--bad-ink)}
.callout .cb{font-size:12.5px;color:var(--mut);margin-top:2px}
.callout svg{flex:none;margin-top:1px}
.callout.ok svg{color:var(--ok)} .callout.bad svg{color:var(--bad)}
.note{font-size:12.5px;color:var(--mut);border:1px solid var(--line);padding:11px 13px;margin-top:14px}
.note b{color:var(--accent)}

/* ═══════════════════════ SYNC CHIP ═══════════════════════ */
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:6px 11px;
  font-family:var(--mo);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.chip .cd{width:7px;height:7px;flex:none}
.chip.synced .cd{background:var(--ok)} .chip.synced{color:var(--ok-ink)}
.chip.local .cd{background:var(--warn)} .chip.local{color:var(--warn-ink)}
.chip.offline{border-color:var(--bad);color:var(--bad-ink)} .chip.offline .cd{background:transparent;border:1.5px solid var(--bad)}
.projsel{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;min-height:44px;padding:0 12px;
  font-family:var(--hd);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);max-width:220px}
.projsel svg{color:var(--mut);flex:none}
.projsel select{position:absolute;opacity:0;pointer-events:none}

/* ═══════════════════════ CALC TILES ═══════════════════════ */
.tile{text-align:left;padding:16px;min-height:96px;display:flex;flex-direction:column;gap:9px;background:var(--surface);transition:background .12s,border-color .12s}
.tile:hover{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.tile:hover .cn{color:var(--accent)}
.tile svg{color:var(--accent)}
.tile .tt{font-family:var(--hd);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.01em;line-height:1.05}
.tile .th{font-family:var(--mo);font-size:10px;letter-spacing:.06em;color:var(--mut);margin-top:auto}
.rlist{border:1px solid var(--line);background:var(--surface)}
.rlist .ri{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 13px;border-bottom:1px solid var(--line);cursor:default;transition:background .12s}
.rlist .ri:hover{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.rlist .ri:last-child{border-bottom:none}
.rlist .ri .rn{font-size:13px;color:var(--ink)}
.rlist .ri .rv{margin-left:auto;font-family:var(--mo);font-size:12px;color:var(--ok-ink)}
.rlist .ri .rt{font-family:var(--mo);font-size:11px;color:var(--mut);min-width:78px;text-align:right}

/* ═══════════════════════ TAKEOFF ═══════════════════════ */
.tk-tools{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.tk-tools .sp{flex:1}
.tk{border:1px solid var(--line);--tkcols:minmax(260px,3fr) minmax(72px,.5fr) minmax(52px,.35fr) minmax(86px,.6fr) minmax(98px,.7fr) 38px}
.tk-layout{display:block}
.tk-rail{display:none}
@media(min-width:1440px){
  .tk-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
  .tk-rail{display:block;position:sticky;top:73px}
  .tk-layout .totbar{display:none}
}
.tk-sum{border:1px solid var(--line);background:var(--surface);padding:16px}
.tk-sum .sg{font-family:var(--mo);font-weight:700;font-size:28px;color:var(--ok-ink);line-height:1.05}
.tk-sum .sn{font-family:var(--mo);font-size:10px;letter-spacing:.06em;color:var(--mut);margin-top:5px}
.tk-sum hr{border:none;border-top:1px solid var(--line);margin:15px 0}
.tk-sb{margin-bottom:11px}
.tk-sb .sr{display:flex;align-items:baseline;gap:8px;font-size:12px}
.tk-sb .sr .cn2{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-sb .sr .cv{margin-left:auto;font-family:var(--mo);font-size:11.5px;color:var(--ink);white-space:nowrap}
.tk-sb .bar{height:3px;background:color-mix(in srgb,var(--ink) 10%,transparent);margin-top:5px}
.tk-sb .bar i{display:block;height:100%;background:var(--accent)}
.tk-rail .acts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.tk-rail .acts .b{width:100%;justify-content:center}
.tk-hd{display:grid;grid-template-columns:var(--tkcols);gap:0;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:2}
.tk-hd span{font-family:var(--mo);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:9px 8px;text-align:right}
.tk-hd span:first-child{text-align:left}
.tk-cat{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:8px 12px;gap:8px}
.tk-cat .cl{font-family:var(--hd);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent)}
.tk-cat .cs{margin-left:auto;font-family:var(--mo);font-size:11px;color:var(--mut)}
.tk-row{display:grid;grid-template-columns:var(--tkcols);align-items:center;min-height:46px;border-bottom:1px solid var(--line);transition:background .12s}
.tk-row:hover{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.tk-row:last-child{border-bottom:none}
.tk-cell{padding:0 8px}
.tk-in{width:100%;background:transparent;border:1px solid transparent;color:var(--ink);font-family:var(--bd);font-size:13px;padding:6px 6px}
.tk-in.num{font-family:var(--mo);text-align:right}
.tk-in.qty{border-bottom:1px dashed var(--ok);border-radius:0}
.tk-in.rate{border-bottom:1px dashed color-mix(in srgb,var(--ink) 25%,transparent)}
.tk-in:focus{outline:none;border:1.5px solid var(--accent);background:var(--accent-tint)}
.tk-tot{font-family:var(--mo);font-size:12.5px;text-align:right;color:var(--ok-ink);padding:0 8px}
.tk-x{background:transparent;border:none;color:var(--mut);font-size:15px;width:100%;height:100%}
.tk-x:hover{color:var(--bad)}
.totbar{display:flex;align-items:center;gap:18px;margin-top:16px;padding:14px 18px;border:1px solid var(--line);background:var(--surface)}
.totbar .tk-lbl{font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.totbar .tk-g{font-family:var(--mo);font-weight:700;font-size:26px;color:var(--ok-ink)}
.hist-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hist-list{max-height:360px;overflow-y:auto}
.hist-row{display:grid;grid-template-columns:24px auto 1fr auto 62px 32px;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-bottom:1px solid var(--line);transition:background .12s}

function calcConcrete(i){
  const t=i.thick/12; let cy=0,contact=0;

  else if(i.element==='wall'){cy=i.L*i.H*t/27;contact=i.L*i.H*2;}
  else if(i.element==='colRect'){cy=(i.cw/12)*(i.cd/12)*i.H*i.count/27;contact=2*((i.cw+i.cd)/12)*i.H*i.count;}
  else if(i.element==='colRound'){const d=i.dia/12;cy=Math.PI/4*d*d*i.H*i.count/27;contact=Math.PI*d*i.H*i.count;}
  else if(i.element==='footing'){cy=i.L*i.W*i.depth*i.count/27;}

const PDFJS_ASSETS='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
function pdfLib(){ const l=window.pdfjsLib; if(!l) throw new Error('PDF library still loading');
  l.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; return l; }

async function renderPdfPage(pdf,i,maxPx){

const SHEET_STRONG=/^[A-Z]{1,3}-?\d{2,3}(\.\d+)?$/;

      if(!t||t.length>10||!SHEET_RE.test(t)) return;

async function rasterizeImage(file){

function CountUp({value,dp=0}){
  const [disp,setDisp]=useState(value); const mounted=useRef(false);
  useEffect(()=>{
    if(mounted.current){ setDisp(value); return; }
    mounted.current=true;
    if(!window.anime||!isFinite(value)){ setDisp(value); return; }
    const o={v:0}; window.anime({targets:o,v:value,duration:650,easing:'easeOutExpo',update:()=>setDisp(o.v)});
  },[value]);
  return <>{num(disp,dp)}</>;
}
function useEnter(deps){

  return ref;
}
function useStagger(){
  const ref=useRef(null);

        <td style={{color:'var(--ok-ink)'}}>{num(wt(r),0)}</td>

      if(arr.every(x=>x)) return;
      const pdf=await ensurePDF(); if(!pdf||!alive||thumbTok.current!==tok) return;
      for(let i=0;i<nPages;i++){
        if(!alive||thumbTok.current!==tok) return;
        if(arr[i]) continue;
        try{ const t=await renderPdfPage(pdf,i,THUMB_MAX); arr[i]=t.dataURL; }catch(e){ arr[i]=''; }
        if(!alive||thumbTok.current!==tok) return;
        setThumbs(arr.slice());
        if(i%5===4) idbPut('okt_thumbs_'+pid,arr.slice());   // checkpoint, so a reload resumes instead of restarting
        await idle(24);                                       // yield — keeps the tab responsive and the fans quiet
      }
      idbPut('okt_thumbs_'+pid,arr);
    })();
    return ()=>{alive=false;};
  },[pid,nPages]);

  // drop the open PDF when the project changes
  useEffect(()=>()=>{ thumbTok.current++; pdfOpening.current=null; if(pdfRef.current){ try{pdfRef.current.destroy();}catch(e){} pdfRef.current=null; } },[pid]);

  useEffect(()=>{ redrawRef.current(); },[tick,tool,project.plan]);
  useEffect(()=>{ const cv=cvRef.current; if(!cv)return;
    const onWheel=(e)=>{ e.preventDefault(); const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,v=viewRef.current,f=Math.exp(-e.deltaY*0.0015),ns=Math.max(0.05,Math.min(v.sc*f,40));
      v.ox=mx-(mx-v.ox)*(ns/v.sc); v.oy=my-(my-v.oy)*(ns/v.sc); v.sc=ns; zoomed.current=true; redrawRef.current(); };
    cv.addEventListener('wheel',onWheel,{passive:false}); return ()=>cv.removeEventListener('wheel',onWheel); },[]);
  // resize: ResizeObserver catches class-driven changes that fire no window resize (fullscreen, rail toggle)
  useEffect(()=>{ const wr=wrapRef.current; if(!wr)return; const h=()=>resizeRef.current();
    let ro=null; if(window.ResizeObserver){ ro=new ResizeObserver(h); ro.observe(wr); }
    window.addEventListener('resize',h);
    return ()=>{ if(ro)ro.disconnect(); window.removeEventListener('resize',h); }; },[]);
  useEffect(()=>{ const h=()=>{ setFs(!!(document.fullscreenElement||document.webkitFullscreenElement));
      // the shell resizes over a frame or two; re-fit once it has settled so the sheet fills the screen
      const go=()=>{ const wr=wrapRef.current; if(!wr)return; sizeRef.current={w:wr.clientWidth,h:wr.clientHeight}; fitRef.current(); redrawRef.current(); };
      setTimeout(go,0); setTimeout(go,150); };                     // setTimeout, not rAF — rAF is skipped when rendering is throttled
    document.addEventListener('fullscreenchange',h); document.addEventListener('webkitfullscreenchange',h);
    return ()=>{ document.removeEventListener('fullscreenchange',h); document.removeEventListener('webkitfullscreenchange',h); }; },[]);

  /* ---- tools ---- */
  function selectTool(k){ setTool(k); draftRef.current=[]; hoverRef.current=null; redrawRef.current(); }
  function cancelDraft(){ draftRef.current=[]; hoverRef.current=null; redrawRef.current(); bump(); }
  function snapPt(nx,ny){ const d=draftRef.current; if(!d.length)return [nx,ny];
    const p=d[d.length-1],dx=(nx-p[0])*W,dy=(ny-p[1])*H,len=Math.hypot(dx,dy);
    const q=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4);
    return [p[0]+Math.cos(q)*len/W, p[1]+Math.sin(q)*len/H]; }
  function addPoint(nx,ny){ const d=draftRef.current;
    if(tool==='scale'){ d.push([nx,ny]); if(d.length===2){ setScaleAsk([d[0],d[1]]); draftRef.current=[]; } redrawRef.current(); bump(); return; }
    d.push([nx,ny]); redrawRef.current(); bump();
  }
  function finishDraft(){ const d=draftRef.current; if(!d.length)return;
    if(tool==='line'&&d.length<2){draftRef.current=[];bump();return;} if((tool==='area'||tool==='volume')&&d.length<3){draftRef.current=[];bump();return;}
    const n=Object.values(measures).filter(m=>m.type===tool).length+1; const id=uid('m');
    const m={id,type:tool,pts:d.slice(),page:cur,category:cat,label:(tool[0].toUpperCase()+tool.slice(1))+' '+n,unit:TOOL_UNIT[tool],ts:Date.now(),added:false,hidden:false}; if(tool==='volume')m.depthIn=depth;
    setMeasures({...measures,[id]:m}); draftRef.current=[]; hoverRef.current=null; bump();
  }
  function commitScale(){ const p=scaleAsk, ft=parseFloat(scaleFt);
    if(p&&ft>0){ const px=Math.hypot((p[1][0]-p[0][0])*W,(p[1][1]-p[0][1])*H);
      savePlan({scales:{...(plan.scales||{}),[cur]:{ppf:px/ft,calPts:p}}});
      toast((nPages>1?(pg.label||'Sheet '+(cur+1))+' — ':'')+'scale set: '+round(px/ft,1)+' px/ft'); }
    setScaleAsk(null); setScaleFt(''); selectTool('count'); }
  function undo(){ if(draftRef.current.length){ draftRef.current.pop(); redrawRef.current(); bump(); return; }
    const list=Object.values(measures).filter(m=>(m.page||0)===cur).sort((a,b)=>(b.ts||0)-(a.ts||0));
    if(!list.length)return; const mm={...measures}; delete mm[list[0].id]; setMeasures(mm); toast('Removed '+list[0].label); }
  function toggleFs(){ const el=shellRef.current; if(!el)return;
    try{ if(document.fullscreenElement||document.webkitFullscreenElement){ const x=document.exitFullscreen||document.webkitExitFullscreen; if(x) x.call(document); }
         else { const r=el.requestFullscreen||el.webkitRequestFullscreen; if(!r){toast('Full screen not supported here');return;} const p=r.call(el); if(p&&p.catch)p.catch(()=>toast('Full screen blocked by the browser')); } }
    catch(e){ toast('Full screen not available'); } }
  function focusSheet(){ const el=sheetInRef.current; if(el){ el.focus(); el.select(); } }

  /* ---- pointer: drag pans, click places, Space forces pan, Shift snaps to ortho ---- */
  function pd(e){ e.currentTarget.setPointerCapture(e.pointerId); const r=e.currentTarget.getBoundingClientRect();
    panRef.current={x:e.clientX-r.left,y:e.clientY-r.top,ox:viewRef.current.ox,oy:viewRef.current.oy,moved:false,force:spaceRef.current}; }
  function pm(e){ const r=e.currentTarget.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,p=panRef.current;
    if(p){ const dx=x-p.x,dy=y-p.y; if(Math.abs(dx)+Math.abs(dy)>4)p.moved=true; if(p.moved||p.force){viewRef.current.ox=p.ox+dx;viewRef.current.oy=p.oy+dy;zoomed.current=true;redrawRef.current();} }
    else if(imgRef.current&&['scale','line','area','volume'].indexOf(tool)>=0){ const n=nrm(x,y); hoverRef.current=e.shiftKey?snapPt(n[0],n[1]):n; redrawRef.current(); }
  }
  function pu(e){ const p=panRef.current; panRef.current=null; if(!p)return; if(p.moved||p.force||tool==='pan'||!imgRef.current)return;
    const r=e.currentTarget.getBoundingClientRect(); const raw=nrm(e.clientX-r.left,e.clientY-r.top);
    if(raw[0]<0||raw[1]<0||raw[0]>1||raw[1]>1)return;
    const q=(e.shiftKey&&tool!=='count')?snapPt(raw[0],raw[1]):raw; addPoint(q[0],q[1]);
  }
  async function onFile(file){ if(!file)return; setBusy(true);
    try{
      thumbTok.current++;
      if(pdfRef.current){ try{pdfRef.current.destroy();}catch(e){} pdfRef.current=null; }
      pdfOpening.current=null;
      if(file.type==='application/pdf'){
        setBusyMsg('Opening…');
        const blob=file.slice(0,file.size,'application/pdf');
        await idbPut('okt_src_'+pid,{blob,name:file.name});
        const pdf=await openPDFBlob(blob); pdfRef.current=pdf;
        const n=pdf.numPages, pgs=[];
        setBusyMsg('Reading '+n+' sheet'+(n>1?'s':'')+'…');
        for(let i=0;i<n;i++){ const p=await pdf.getPage(i+1), d=pageDims(p.getViewport({scale:1}),PLAN_MAX);
          if(p.cleanup)p.cleanup(); pgs.push({w:d.w,h:d.h,label:'Page '+(i+1)}); }
        const labs=[]; for(let i=0;i<n;i++){ labs.push(await sheetLabel(pdf,i)); if(i%8===7) await idle(0); }
        if(trustLabels(labs)) labs.forEach((lb,i)=>{ if(lb) pgs[i].label=lb; });
        setBusyMsg('Rendering sheet 1…');
        const rec=await renderPdfPage(pdf,0,PLAN_MAX);
        await idbPut('okt_page_'+pid+'_0',rec); pushPage(0,rec);
        await idbPut('okt_thumbs_'+pid,new Array(n).fill(null));
        imgRef.current=await loadImg(rec.dataURL); setMissing(false);
        savePlan({hasImg:true,pages:pgs,pageCount:n,cur:0,dims:{w:rec.w,h:rec.h},scales:{},scale:null});
        fit(rec.w,rec.h); redrawRef.current();
        toast(n>1?(n+' sheets loaded — set the scale on each'):'Plan loaded — set the scale');
      } else {
        const rec=await rasterizeImage(file);
        await idbPut('okt_page_'+pid+'_0',rec); await idbPut('okt_plan_'+pid,rec); pushPage(0,rec);
        await idbPut('okt_thumbs_'+pid,[]);
        imgRef.current=await loadImg(rec.dataURL); setMissing(false);
        savePlan({hasImg:true,pages:[{w:rec.w,h:rec.h,label:(file.name||'').replace(/\.[^.]+$/,'').slice(0,16)||'Page 1'}],pageCount:1,cur:0,dims:{w:rec.w,h:rec.h},scales:{},scale:null});
        fit(rec.w,rec.h); redrawRef.current();
        toast('Plan loaded — set the scale');
      }
    }catch(e){ toast('Could not load: '+(e.message||e)); }
    setBusy(false); setBusyMsg('');
  }

  const draftLive=()=>{ const d=draftRef.current; if(!d.length)return null; if(tool==='count')return {q:d.length,u:'EA'}; if(tool==='line')return {q:round(segLenFt(d,W,H,ppf),1),u:'LF'}; if(tool==='area')return {q:round(areaFt(d,W,H,ppf),0),u:'SF'}; if(tool==='volume')return {q:round(areaFt(d,W,H,ppf)*(depth/12)/27,2),u:'CY'}; return null; };
  const live=draftLive();
  const allM=Object.values(measures).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const mlist=allSheets?allM:allM.filter(m=>(m.page||0)===cur);
  const marked={}; allM.forEach(m=>{marked[m.page||0]=1;});
  const addM=(m)=>{ const q=round(qtyOf(m),m.unit==='CY'?2:(m.unit==='LF'?1:0)); if(!(q>0)){toast('Set the scale on that sheet first');return;}
    onTakeoff([{category:m.category,desc:descOf(m),qty:q,unit:m.unit}]); setMeasures({...measures,[m.id]:{...m,added:true}}); };
  function addAll(){ const pend=mlist.filter(m=>!m.added);
    const items=pend.map(m=>({category:m.category,desc:descOf(m),qty:round(qtyOf(m),m.unit==='CY'?2:m.unit==='LF'?1:0),unit:m.unit})).filter(it=>it.qty>0);
    if(!items.length){toast('Nothing to add — set the scale first');return;}
    onTakeoff(items); const mm={...measures}; pend.forEach(m=>{if(qtyOf(m)>0)mm[m.id]={...mm[m.id],added:true};}); setMeasures(mm); }

  /* ---- keyboard (Bluebeam-style). Latest-ref pattern so nothing goes stale. ---- */
  function onKey(e){
    const t=e.target, fld=!!(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.isContentEditable));
    if(e.key==='Escape'){ if(showKeys){setShowKeys(false);return;} if(fld){ if(t.blur)t.blur(); return; }
      if(scaleAsk){setScaleAsk(null);setScaleFt('');} cancelDraft(); selectTool('pan'); return; }
    if(fld) return;
    const k=e.key, mod=e.metaKey||e.ctrlKey, stop=()=>e.preventDefault();
    if(k===' '){ if(!spaceRef.current){spaceRef.current=true;setGrab(true);} stop(); return; }
    if(mod){
      if(k==='z'||k==='Z'){ stop(); undo(); }
      else if(k==='Enter'){ stop(); addAll(); }
      else if(k==='0'){ stop(); fit(); redrawRef.current(); }
      else if(k==='1'){ stop(); fitWidth(); redrawRef.current(); }
      else if(k==='g'||k==='G'){ stop(); focusSheet(); }
      return;
    }
    if(e.altKey) return;
    switch(k){
      case 'f': case 'F': case 'F11': stop(); toggleFs(); return;
      case '?': stop(); setShowKeys(s=>!s); return;
      case '0': stop(); fit(); redrawRef.current(); return;
      case 'w': case 'W': stop(); fitWidth(); redrawRef.current(); return;
      case '+': case '=': stop(); zoomCenter(1.25); return;
      case '-': case '_': stop(); zoomCenter(0.8); return;
      case 'd': case 'D': if(nPages){stop(); savePlan({dimImg:!plan.dimImg});} return;
      case 't': case 'T': if(nPages>1){stop(); setRail(r=>!r);} return;
      case 'g': case 'G': if(nPages>1){stop(); focusSheet();} return;
      case ']': case 'PageDown': stop(); goPage(cur+1); return;
      case '[': case 'PageUp': stop(); goPage(cur-1); return;
      case 'Home': stop(); goPage(0); return;
      case 'End': stop(); goPage(nPages-1); return;
      case 'Enter': if(draftRef.current.length){stop(); finishDraft();} return;
      case 'Backspace': stop(); undo(); return;
      case '1': stop(); selectTool('pan'); return;
      case '2': case 's': case 'S': stop(); selectTool('scale'); return;
      case '3': case 'c': case 'C': stop(); selectTool('count'); return;
      case '4': case 'l': case 'L': stop(); selectTool('line'); return;
      case '5': case 'a': case 'A': stop(); selectTool('area'); return;
      case '6': case 'v': case 'V': stop(); selectTool('volume'); return;
      default: return;
    }
  }
  keyRef.current=onKey;
  useEffect(()=>{ const kd=(e)=>keyRef.current(e); const ku=(e)=>{ if(e.key===' '){spaceRef.current=false;setGrab(false);} };
    window.addEventListener('keydown',kd); window.addEventListener('keyup',ku);
    return ()=>{ window.removeEventListener('keydown',kd); window.removeEventListener('keyup',ku); spaceRef.current=false; }; },[]);

  const TOOLS=[['pan','move','Pan','1'],['scale','crosshair','Scale','2 · S'],['count','pin','Count','3 · C'],['line','polyline','Linear','4 · L'],['area','poly','Area','5 · A'],['volume','box','Volume','6 · V']];
  const cursor=grab?'grabbing':(tool==='pan'?'grab':(imgRef.current?'crosshair':'default'));
  return <div>
    <div className="plan-shell" ref={shellRef}>
      <div className="plan-bar">
        <div className="plan-tools">{TOOLS.map(([k,ic,lb,ky])=><button key={k} className={tool===k?'on':''} onClick={()=>selectTool(k)} title={lb+'  ('+ky+')'}><Icon n={ic} s={17}/><span className="tl">{lb}</span></button>)}</div>
        <label className="b sec" style={{minHeight:44,cursor:'pointer'}}><Icon n="upload" s={16}/>{busy?(busyMsg||'Loading…'):(nPages?'Replace':'Load plan')}<input type="file" accept="image/*,application/pdf" style={{display:'none'}} onChange={e=>onFile(e.target.files[0])}/></label>
        {nPages>0&&<>
          <button className="b icon sec" title="Fit sheet  (0)" onClick={()=>{fit();redrawRef.current();}}><Icon n="crosshair" s={16}/></button>
          <button className={'b icon sec'+(plan.dimImg?' on':'')} title="Dim the drawing  (D)" onClick={()=>savePlan({dimImg:!plan.dimImg})}><Icon n="eye" s={16}/></button>
          <button className={'b icon sec'+(fs?' on':'')} title="Full screen  (F)" onClick={toggleFs}><Icon n={fs?'shrink':'expand'} s={16}/></button>
          <button className="b icon sec" title="Keyboard shortcuts  (?)" onClick={()=>setShowKeys(true)}><Icon n="keys" s={16}/></button>
        </>}
        {nPages>1&&<div className="plan-sheet">
          <button title="Previous sheet  ([)" disabled={cur<=0} onClick={()=>goPage(cur-1)}><Icon n="back" s={15}/></button>
          <span className="lbl"><b>{pg.label||('Page '+(cur+1))}</b>
            <input ref={sheetInRef} key={cur} className="shn" defaultValue={cur+1} title="Go to sheet  (G)"
              onFocus={e=>e.target.select()}
              onKeyDown={e=>{ if(e.key==='Enter'){const v=parseInt(e.target.value,10); if(v>=1&&v<=nPages)goPage(v-1); e.target.blur();} if(e.key==='Escape'){e.target.value=cur+1;e.target.blur();} }}
              onBlur={e=>{e.target.value=cur+1;}}/>/{nPages}</span>
          <button title="Next sheet  (])" disabled={cur>=nPages-1} onClick={()=>goPage(cur+1)}><Icon n="fwd" s={15}/></button>
          <button className={rail?'on':''} title="Sheet rail  (T)" onClick={()=>setRail(r=>!r)}><Icon n="layers" s={15}/></button>
        </div>}
        <span style={{flex:1}}/>
        <span className="plan-cat"><span className="field-lbl" style={{margin:0}}>Category</span>
        <select className="f-sel" style={{width:150,minHeight:44}} value={cat} onChange={e=>setCat(e.target.value)}>{scope.cats.map(c=><option key={c}>{c}</option>)}</select></span>
        {tool==='volume'&&<label className="f" style={{minHeight:44,width:130}}><span className="f-main"><span className="f-lbl">Thickness</span><input className="f-val" type="number" value={depth} onChange={e=>setDepth(parseFloat(e.target.value)||0)}/></span><span className="f-unit">in</span></label>}
      </div>
      {rookie&&!fs&&<div className="note" style={{marginBottom:10}}><b>{tool[0].toUpperCase()+tool.slice(1)}:</b> {PLAN_INFO[tool]} <span style={{color:'var(--mut)'}}>Press <b>?</b> for shortcuts.</span></div>}
      {nPages>1&&rail&&<div className="plan-rail">{pages.map((p,i)=>
        <button key={i} className={'plan-thumb'+(i===cur?' on':'')+(marked[i]?' has':'')} onClick={()=>goPage(i)} title={(p.label||('Page '+(i+1)))+'  —  sheet '+(i+1)+' of '+nPages}>
          {thumbs[i]?<img className="tb" src={thumbs[i]} alt=""/>:<span className="tp">{i+1}</span>}
          <span className="tn">{p.label||('Page '+(i+1))}</span>
        </button>)}</div>}
      <div className={'plan-canvas-wrap'+(dragOver?' drag':'')} ref={wrapRef}
        onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)}
        onDrop={e=>{e.preventDefault();setDragOver(false);onFile(e.dataTransfer.files[0]);}}>
        <canvas ref={cvRef} style={{cursor}} onPointerDown={pd} onPointerMove={pm} onPointerUp={pu} onDoubleClick={()=>{if(['line','area','volume'].indexOf(tool)>=0)finishDraft();}}/>
        <span className={'plan-scalechip'+(ppf?'':' warn')}><Icon n="crosshair" s={13}/>{ppf?<>{nPages>1?(pg.label||'Sheet '+(cur+1))+' — ':''}<b>{round(ppf,1)} px/ft</b></>:(nPages>1?'Scale not set on this sheet':'Scale not set')}</span>
        {nPages>0&&<div className="plan-zoom"><button title="Zoom in  (+)" onClick={()=>zoomCenter(1.25)}>+</button><button title="Zoom out  (−)" onClick={()=>zoomCenter(0.8)}>−</button></div>}
        {pageBusy&&<span className="plan-busy">Rendering sheet…</span>}
        {!nPages&&<div className={'plan-drop'+(dragOver?' drag':'')}><Icon n="upload" s={30}/><div style={{fontFamily:'var(--hd)',fontWeight:600,fontSize:17,textTransform:'uppercase',color:'var(--ink)'}}>{busy?(busyMsg||'Loading…'):'Drop a drawing set or PDF'}</div><div style={{fontSize:12.5}}>PNG · JPG · multi-sheet PDF — then set the scale and measure</div><label className="b pri" style={{cursor:'pointer',marginTop:4}}><Icon n="upload" s={16}/>Choose file<input type="file" accept="image/*,application/pdf" style={{display:'none'}} onChange={e=>onFile(e.target.files[0])}/></label></div>}
        {nPages>0&&missing&&!pageBusy&&<div className="plan-drop"><Icon n="file" s={28}/><div style={{fontFamily:'var(--hd)',fontWeight:600,fontSize:16,textTransform:'uppercase',color:'var(--ink)'}}>Sheet not cached on this device</div><div style={{fontSize:12.5,maxWidth:320}}>Open it once on the device you uploaded from, or load the set again here. Your measurements are safe either way.</div></div>}
        {scaleAsk&&<div className="plan-actionbar"><span style={{fontSize:12,color:'var(--mut)'}}>Real length of that line?</span><input className="f-val" autoFocus style={{width:70,fontFamily:'var(--mo)',fontSize:16,borderBottom:'1px solid var(--accent)'}} type="number" value={scaleFt} onChange={e=>setScaleFt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&commitScale()}/><span style={{fontFamily:'var(--mo)',fontSize:12,color:'var(--mut)'}}>ft</span><button className="b pri" style={{minHeight:38}} onClick={commitScale}>Set scale</button><button className="b sec" style={{minHeight:38}} onClick={()=>{setScaleAsk(null);setScaleFt('');}}>Cancel</button></div>}
        {live&&!scaleAsk&&<div className="plan-actionbar"><span className="live">{live.q}<small> {live.u}</small></span><button className="b icon sec" title="Undo point  (Backspace)" style={{minHeight:38}} onClick={undo}><Icon n="undo" s={15}/></button>{tool!=='count'&&<button className="b pri" style={{minHeight:38}} onClick={finishDraft}><Icon n="check" s={15}/>Finish</button>}{tool==='count'&&<button className="b pri" style={{minHeight:38}} onClick={finishDraft}><Icon n="check" s={15}/>Save {draftRef.current.length}</button>}<button className="b sec" style={{minHeight:38}} onClick={cancelDraft}>Cancel</button></div>}
      </div>
      {showKeys&&<KeySheet onClose={()=>setShowKeys(false)}/>}
    </div>
    <div style={{display:'flex',alignItems:'center',marginTop:16,gap:10,flexWrap:'wrap'}}><p className="kick" style={{margin:0}}>Measurements</p><span className="vp clear" style={{fontSize:10}}>{mlist.length}</span>
      {nPages>1&&<div className="seg mono seg-inline" style={{marginLeft:4}}><button className={allSheets?'':'on'} onClick={()=>setAllSheets(false)}>This sheet</button><button className={allSheets?'on':''} onClick={()=>setAllSheets(true)}>All sheets</button></div>}
      <span style={{flex:1}}/>{mlist.some(m=>!m.added)&&<button className="b ok" style={{minHeight:38}} onClick={addAll}><Icon n="check" s={15}/>Add all</button>}</div>
    {mlist.length===0? <div className="empty" style={{marginTop:8}}>{nPages?(allSheets||nPages<2?'No measurements yet. Set the scale, then start measuring.':'Nothing measured on this sheet yet.'):'No measurements yet. Load a plan, set the scale, and start measuring.'}</div> :
    <div className="plan-mlist">{mlist.map(m=>{const q=qtyOf(m);const mp=pageOf(m);return <div key={m.id} className={'plan-mrow'+(m.hidden?' off':'')}>
      <span style={{color:({count:'var(--accent)',line:'#22d3ee',area:'var(--ok-ink)',volume:'var(--warn)'})[m.type]}}><Icon n={({count:'pin',line:'polyline',area:'poly',volume:'box'})[m.type]} s={15}/></span>
      <select className="msel" value={m.category} onChange={e=>setMeasures({...measures,[m.id]:{...m,category:e.target.value,added:false}})}>{scope.cats.map(c=><option key={c}>{c}</option>)}</select>
      <input className="mlbl" value={m.label} onChange={e=>setMeasures({...measures,[m.id]:{...m,label:e.target.value}})}/>

    try{ let key=null; try{ key=window.fb?await window.fb.rootGet('config/minimax_key'):null; }catch(e){} if(!key) key=localStorage.getItem('minimax_key');
      if(!key){ setMsgs(m=>[...m,{r:'a',t:"No AI key configured — this is the offline prototype. Add a MiniMax key (localStorage 'minimax_key') to enable me. The calculators work fully without me."}]); setBusy(false); return; }
      const res=await fetch('https://api.minimax.io/anthropic/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'MiniMax-M2.7',max_tokens:600,system:"You are Alfred, a concrete-superintendent assistant inside OnKlooth Takeoff. Be concise and practical. Cite ACI 318 / ACI 347 / ASCE 7 where relevant. Current tab: "+tab+".",messages:[{role:'user',content:question}]})});
      const j=await res.json(); setMsgs(m=>[...m,{r:'a',t:(j.content&&j.content[0]&&j.content[0].text)||(j.error&&j.error.message)||'No response.'}]);
    }catch(e){ setMsgs(m=>[...m,{r:'a',t:'Offline or network error — Alfred needs a connection. Calculators still work.'}]); }
    setBusy(false);
  }
  return <>
    <button className="fab" onClick={()=>setOpen(o=>!o)} title="Alfred"><Icon n={open?'x':'spark'} s={22}/></button>
    {open&&<div className="sheet" ref={sheet}>
      <div className="sheet-hd"><Icon n="spark" s={18}/><div><div className="sh1">Alfred</div><div className="sh2">FIELD ASSISTANT</div></div><span style={{flex:1}}/><button className="b icon sec" onClick={()=>setOpen(false)}><Icon n="x" s={16}/></button></div>
      <div className="sheet-msgs">{msgs.map((m,x)=><div key={x} className={'msg '+(m.r==='u'?'u':'a')}>{m.t}</div>)}<div ref={end}/></div>
      <div className="sheet-in"><input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Yap at Alfred…"/><button className="b pri icon" onClick={send} disabled={busy}><Icon n="send" s={16}/></button></div>
    </div>}
  </>;
}

/* ═══════════ MODAL / SYNC / THEME ═══════════ */
function ProjectModal({onClose,onCreate}){
  const [f,setF]=useState({name:'',jobNumber:'',location:'',scope:'tower'}); const ref=useRef(null);
  useEffect(()=>{ if(MO&&ref.current) MO.animate(ref.current,{opacity:[0,1],transform:['scale(.96)','scale(1)']},{duration:.16,easing:'ease-out'}); },[]);
  return <div className="ov grid-bg" onClick={onClose}><div className="dialog" ref={ref} onClick={e=>e.stopPropagation()}>
    <span className="dk">New project</span><h3>Start a project</h3>
    <div className="stack">
      <label className="f"><span className="f-main"><span className="f-lbl">Project name</span><input className="f-val" style={{fontFamily:'var(--bd)',fontSize:15}} autoFocus value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="Marina Shores — Bldg A"/></span></label>
      <label className="f"><span className="f-main"><span className="f-lbl">Job number</span><input className="f-val" value={f.jobNumber} onChange={e=>setF({...f,jobNumber:e.target.value})} placeholder="24-118"/></span><span className="f-unit">NO.</span></label>
      <label className="f"><span className="f-main"><span className="f-lbl">Location</span><input className="f-val" style={{fontFamily:'var(--bd)',fontSize:15}} value={f.location} onChange={e=>setF({...f,location:e.target.value})} placeholder="Mission Bay, SF"/></span><span className="f-unit"><Icon n="grid" s={14}/></span></label>
      <div><span className="field-lbl">Job scope — sets the estimate categories</span>
        <Seg opts={SCOPEKEYS.map(k=>({v:k,l:SCOPES[k].name.split(' / ')[0]}))} value={f.scope} onChange={(v)=>setF({...f,scope:v})}/></div>
    </div>
    <div className="dact"><button className="b sec" style={{flex:1}} onClick={onClose}>Cancel</button><button className="b pri" style={{flex:1.6}} disabled={!f.name.trim()} onClick={()=>onCreate(f)}>Create project</button></div>
  </div></div>;
}
function SyncChip({fb,online}){
  const state=!fb?'local':(online?'synced':'offline');
  const lbl={synced:'Synced',local:'Local',offline:'Offline'}[state];
  return <span className={'chip '+state} title={state==='synced'?'Synced to cloud':state==='local'?'Local-only mode':'Offline — saved locally'}><span className="cd"/>{lbl}</span>;
}
function ThemeBtn({theme,setTheme}){
  return <button className="b icon sec" title="Toggle theme" onClick={()=>setTheme(theme==='dark'?'light':'dark')}><Icon n={theme==='dark'?'sun':'moon'} s={18}/></button>;
}

/* ═══════════ ROOT ═══════════ */
function App(){
  const [data,setData]=useState(loadLocal);
  const [activeId,setActiveId]=useState(()=>localStorage.getItem('okt_active')||null);
  const [tab,setTab]=useState('dash'); const [modal,setModal]=useState(false); const [navOpen,setNavOpen]=useState(false);
  const [online,setOnline]=useState(false); const [toastMsg,setToastMsg]=useState(null);
  const [theme,setTheme]=useState(()=>localStorage.getItem('okt_theme')||'dark');
  const [rookie,setRookie]=useState(()=>localStorage.getItem('okt_rookie')==='1');
  const [rates,setRates]=useState(()=>{ try{return JSON.parse(localStorage.getItem('okt_rates'))||RATES;}catch(e){return RATES;} });
  const toast=(m)=>{ setToastMsg(m); setTimeout(()=>setToastMsg(null),2200); };
  useEffect(()=>{ document.documentElement.setAttribute('data-theme',theme); localStorage.setItem('okt_theme',theme);
    document.querySelector('meta[name=theme-color]').setAttribute('content',theme==='dark'?'#0a1017':'#f2f4f6'); },[theme]);
  useEffect(()=>{ localStorage.setItem('okt_rookie',rookie?'1':'0'); },[rookie]);
  useEffect(()=>{ if(!window.fb) return; window.fb.connState(setOnline);
    const off=window.fb.listen('projects',(v)=>{ if(v){ setData(v); saveLocal(v); } });
    const offR=window.fb.listen('rates',(v)=>{ if(v) setRates(v); });
    return ()=>{off();offR();}; },[]);
  const saveRates=(r)=>{ setRates(r); try{localStorage.setItem('okt_rates',JSON.stringify(r));}catch(e){} if(window.fb) window.fb.set('rates',r).catch(()=>{}); };

  const projects=Object.keys(data).map(id=>({id,...data[id]}));
  const active=activeId&&data[activeId]?data[activeId]:null;
  const writeProject=useCallback((id,proj)=>{ setData(prev=>{const next={...prev,[id]:proj};saveLocal(next);return next;}); if(window.fb) window.fb.set('projects/'+id,proj).catch(()=>{}); },[]);
  /* Two project writes in one tick (e.g. "Add" = push an estimate line + flag the measurement)
     both built from the same render's `active`, so the second silently dropped the first.
     patchProject derives each write from the latest value, so they compose. */
  const dataRef=useRef(data); dataRef.current=data;
  const patchProject=useCallback((id,fn)=>{ const cur=dataRef.current&&dataRef.current[id]; if(!cur) return;
    const proj=fn(cur); dataRef.current={...dataRef.current,[id]:proj}; writeProject(id,proj); },[writeProject]);
  function createProject(f){ const id=uid('p'); const proj={meta:{name:f.name.trim(),jobNumber:f.jobNumber,location:f.location,scope:f.scope||'tower',createdAt:todayISO()},runs:{},takeoff:{items:{}}};
    writeProject(id,proj); setActiveId(id); localStorage.setItem('okt_active',id); setModal(false); setTab('dash'); toast('Project created & synced'); }
  function selectProject(id){ setActiveId(id); localStorage.setItem('okt_active',id); setTab('dash'); }
  const saveRun=(type,label,inputs,outputs)=>{ if(!active) return; const id=uid('r');
    patchProject(activeId,p=>({...p,runs:{...(p.runs||{}),[id]:{id,type,label,inputs,date:todayISO()}}})); toast('Run saved to '+active.meta.name); };
  const addTakeoff=(items)=>{ if(!active) return; let ts=Date.now();
    patchProject(activeId,p=>{ const m={...((p.takeoff&&p.takeoff.items)||{})};
      items.forEach(it=>{const id=uid('t');m[id]={id,...it,rate:rateFor(rates,it.category,it.unit),ts:ts++};});
      return {...p,takeoff:{...p.takeoff,items:m}}; });
    toast(items.length+' item(s) added to estimate'); };
  const setTakeoffItems=(m)=>{ if(!active) return; patchProject(activeId,p=>({...p,takeoff:{...p.takeoff,items:m}})); };
  const setPlan=(planObj)=>{ if(!active) return; patchProject(activeId,p=>({...p,plan:planObj})); };

  const NAV=[{g:'PROJECT'},{k:'dash',n:'Dashboard',i:'grid'},{k:'plan',n:'Plan',i:'ruler'},{k:'takeoff',n:'Estimate',i:'file',badge:active&&active.takeoff&&active.takeoff.items?Object.keys(active.takeoff.items).length:0},
    {g:'CALCULATORS'},{k:'concrete',n:'Concrete',i:'box'},{k:'formwork',n:'Formwork',i:'gauge'},{k:'reshore',n:'Reshore',i:'layers'},{k:'pump',n:'Concrete Pump',i:'gauge'},{k:'rebar',n:'Rebar + Crane',i:'grid'},{k:'thermal',n:'Mass Thermal',i:'thermo'},{k:'rigging',n:'Rigging',i:'hook'}];
  const TITLES={dash:['Dashboard','','project overview & calc runs'],plan:['Plan Takeoff','','measure quantities off the drawing'],takeoff:['Estimate','','priced master estimate → export'],
    concrete:['Concrete Volume','','pours → takeoff CY'],
    reshore:['Reshore / Backshore','ACI 209 · SIMPLIFIED','multi-level construction load capacity'],formwork:['Formwork Pressure','ACI 347','lateral form pressure'],
    pump:['Concrete Pump','PUTZMEISTER','pressure, output & washout'],rebar:['Rebar + Crane','ACI 318-14','lap/dev · schedule · outrigger'],
    thermal:['Mass Concrete Thermal','ACI 207','peak temp & ΔT estimate'],rigging:['Rigging & Lift','','sling tension by angle']};

  return <RookieCtx.Provider value={rookie}><div className="app">
    <div className="topbar">
      <button className="b icon sec menu-btn" onClick={()=>setNavOpen(o=>!o)}><Icon n="grid" s={18}/></button>
      <Mark size="s34"/>
      <div className="lockup"><span className="lk1">ONKLOOTH</span><span className="lk2">TAKEOFF · FIELD ENG</span></div>
      <span className="sp"/>
      {projects.length>0&&active&&<div className="projsel" onClick={()=>{ const ids=projects.map(p=>p.id); const cur=ids.indexOf(activeId); selectProject(ids[(cur+1)%ids.length]); }} title="Switch project">{active.meta.name}<Icon n="chevron" s={16}/></div>}
      <button className={'b icon sec'+(rookie?' on':'')} title="Rookie mode — input help" onClick={()=>setRookie(r=>!r)}><Icon n="grad" s={18}/></button>
      <ThemeBtn theme={theme} setTheme={setTheme}/>
      <button className="b sec" onClick={()=>setModal(true)}><Icon n="plus" s={16}/>New</button>
      <SyncChip fb={window.fb} online={online}/>
    </div>

    {!active?<div className="main"><div className="welcome-wrap">
      <Mark size="s56"/>
      <p className="kick acc" style={{marginTop:18}}>OpenYap field tools</p>
      <h1 className="hero-h">Concrete numbers,<br/>on the deck.</h1>
      <p className="hero-sub">Start a project, pick its scope, and every calc you run saves, syncs, and rolls up into a priced master estimate you can export.</p>
      <button className="b pri big" onClick={()=>setModal(true)}><Icon n="plus" s={18}/>Start a project</button>
      {projects.length>0&&<div style={{marginTop:28}}>
        <p className="kick">On this device</p>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>{projects.map(p=><button key={p.id} onClick={()=>selectProject(p.id)}><Frame className="proj-card"><div><div className="pn">{p.meta.name}</div><div className="pm">JOB {p.meta.jobNumber||'—'} · {(SCOPES[p.meta.scope]||SCOPES.tower).name} · {p.meta.location||'—'}</div></div><Icon n="chevron" s={18} c="var(--mut)"/></Frame></button>)}</div>
      </div>}
      <div className="footer" style={{marginTop:30}}>AN OPENYAP FIELD TOOL · v2.5 — YAP LESS · POUR MORE</div>
    </div></div>
    :<div className="body">
      <div className={'nav'+(navOpen?' open':'')} onClick={()=>setNavOpen(false)}>
        {NAV.map((n,x)=>n.g?<div className="grp" key={'g'+x}>{n.g}</div>:<a key={n.k} className={tab===n.k?'act':''} onClick={()=>setTab(n.k)}><Icon n={n.i} s={18}/>{n.n}{n.badge?<span className="bdg">{n.badge}</span>:null}</a>)}
      </div>
      <div className={'main'+(tab==='plan'||tab==='takeoff'?' wide':'')}>
        <div className="head"><h1>{TITLES[tab][0]}</h1><div className="meta">{active.meta.name}{active.meta.jobNumber?' · JOB '+active.meta.jobNumber:''}{TITLES[tab][1]?' · '+TITLES[tab][1]:''} — {TITLES[tab][2]}</div></div>
        {tab==='dash'&&<Dashboard project={active} go={setTab} theme={theme}/>}
        {tab==='plan'&&<PlanTakeoff project={active} pid={activeId} setPlan={setPlan} onTakeoff={addTakeoff} toast={toast}/>}
        {tab==='takeoff'&&<Takeoff project={active} setItems={setTakeoffItems} toast={toast} rates={rates} saveRates={saveRates}/>}
        {tab==='concrete'&&<ConcreteCalc onSave={saveRun} onTakeoff={addTakeoff}/>}
        {tab==='reshore'&&<Reshore onSave={saveRun} onTakeoff={addTakeoff}/>}
        {tab==='formwork'&&<Formwork onSave={saveRun} onTakeoff={addTakeoff}/>}
        {tab==='pump'&&<Pump onSave={saveRun} onTakeoff={addTakeoff}/>}
        {tab==='rebar'&&<RebarCrane onSave={saveRun} onTakeoff={addTakeoff}/>}
        {tab==='thermal'&&<Thermal onSave={saveRun}/>}
        {tab==='rigging'&&<Rigging onSave={saveRun}/>}
        {['concrete','formwork','reshore','pump','rebar'].indexOf(tab)>=0 && <TakeoffHistory project={active} setItems={setTakeoffItems} go={setTab}/>}
      </div>
    </div>}

    {modal&&<ProjectModal onClose={()=>setModal(false)} onCreate={createProject}/>}
    {active&&<Alfred tab={tab}/>}
    {toastMsg&&<Toast msg={toastMsg}/>}
  </div></RookieCtx.Provider>;
}
function Toast({msg}){
  const ref=useRef(null);
  useEffect(()=>{ if(MO&&ref.current) MO.animate(ref.current,{opacity:[0,1],transform:['translate(-50%,10px)','translate(-50%,0)']},{duration:.18,easing:'ease-out'}); },[]);
  return <div className="toast" ref={ref}><Icon n="check" s={16}/>{msg}</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
